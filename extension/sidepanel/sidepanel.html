<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent</title>
<style>
  :root {
    --bg: #0b0d10; --surface: #14181d; --line: #232a33;
    --fg: #e8ecf2; --muted: #8e99a8; --accent: #6d8cff;
    --ok: #22c55e; --warn: #f59e0b; --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
  .status { margin-top: 4px; font-size: 12px; color: var(--muted); display: flex;
            align-items: center; gap: 7px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
                    background: var(--muted); flex: none; }
  .status.ok::before { background: var(--ok); }
  .status.busy::before { background: var(--warn); animation: pulse 1s infinite; }
  .status.warn::before { background: var(--warn); }
  .status.err::before { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3 } }

  #log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex;
         flex-direction: column; gap: 10px; }
  .turn { padding: 9px 12px; border-radius: 11px; max-width: 92%; white-space: pre-wrap; }
  .turn.user { align-self: flex-end; background: var(--accent); color: #08101f;
               border-bottom-right-radius: 4px; font-weight: 500; }
  .turn.agent { align-self: flex-start; background: var(--surface);
                border: 1px solid var(--line); border-bottom-left-radius: 4px; }

  .panel { border-top: 1px solid var(--line); padding: 12px 16px; }
  .panel h2 { margin: 0 0 7px; font-size: 11px; text-transform: uppercase;
              letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  #facts { font-size: 12.5px; color: var(--muted); max-height: 110px; overflow-y: auto; }
  .fact { padding: 2px 0; }
  .kind { display: inline-block; min-width: 108px; color: var(--accent);
          font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }

  footer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  #talk { width: 100%; padding: 12px; border: 0; border-radius: 10px;
          background: var(--accent); color: #08101f; font: 600 14px/1 inherit;
          cursor: pointer; }
  #talk.rec { background: var(--err); color: #fff; }
  .row { display: flex; gap: 8px; margin-top: 9px; }
  #text { flex: 1; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
          background: var(--surface); color: var(--fg); font: inherit; }
  #text::placeholder { color: #5c6675; }
  #send { padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line);
          background: var(--surface); color: var(--fg); cursor: pointer; font: inherit; }
  #send:hover { background: #1c222a; }
  .hint { margin-top: 8px; font-size: 11.5px; color: #5c6675; }
</style>
</head>
<body>
  <header>
    <h1>Voice Agent</h1>
    <div id="status" class="status">Connecting…</div>
  </header>

  <div id="log">
    <div class="turn agent">Tell me about yourself, or ask me to rebuild this page around you.</div>
  </div>

  <div class="panel">
    <h2>What I know about you</h2>
    <div id="facts">Nothing learned about you yet.</div>
  </div>

  <footer>
    <button id="talk">Hold to talk</button>
    <div class="row">
      <input id="text" type="text" placeholder="…or type instead" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div class="hint">⌘⇧U / Ctrl+Shift+U to talk from any page</div>
  </footer>

  <audio id="tts" hidden></audio>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
